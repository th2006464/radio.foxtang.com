<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101f1d"><title>关于 · Radio</title><link rel="icon" type="image/png" href="https://logo.foxtang.com/avatars-512/set-05/media.png"><style>body{background:#101f1d;color:#eee;font:15px/1.9 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;margin:0;padding:12vh 8vw}main{max-width:660px;margin:auto}a{color:#ff977a}h1{font-size:30px;font-weight:450;letter-spacing:-.05em}p{color:#b9c8bc}small{color:#8ea398}</style></head><body><main><a href="/">← 返回电台</a><h1>关于这个电台探索项目</h1><p>这是部署在 radio.foxtang.com 的独立学习与复刻项目。界面灵感来自 <a href="https://roamdial.com/" rel="noopener noreferrer" target="_blank">RoamDial</a>，与其运营者没有关联，也不是 RoamDial 官方网站。</p><p>广播目录与经纬度取自 <a href="https://www.radio-browser.info/" target="_blank" rel="noopener noreferrer">Radio Browser</a> 的公开社区数据。原网站还使用 <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a>；本项目当前不调用 GeoNames 的地理编码 API。电台音频通常由浏览器直接连接各电台，个别 HTTP 或编码不兼容的电台可能无法播放。</p><p><small>Built for Radio · 2026</small></p></main></body></html>
